services:
  inference:
    image: ghcr.io/iamloren/creator-support-inference:${IMAGE_TAG:-latest}

    container_name: customer-support-inference-prod

    environment:
      MODEL_PATH: /app/artifacts/final_model/model.joblib
      INFERENCE_LOG_PATH: /app/artifacts/production/inference_log.jsonl
      FEEDBACK_LOG_PATH: /app/artifacts/production/feedback_log.jsonl
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./artifacts/production:/app/artifacts/production

    restart: unless-stopped

  frontend:
    image: ghcr.io/iamloren/creator-support-frontend:${IMAGE_TAG:-latest}

    container_name: customer-support-frontend-prod

    ports:
      - "${FRONTEND_PORT:-8081}:80"

    depends_on:
      - inference

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    container_name: customer-support-prometheus-prod

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    depends_on:
      - inference

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest

    container_name: customer-support-grafana-prod

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
