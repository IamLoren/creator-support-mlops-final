name: Final MLOps CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  train:
    name: Train and validate model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-training.txt

      - name: Configure DVC remote
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          dvc remote modify --local r2 endpointurl "$R2_ENDPOINT_URL"
          dvc remote modify --local r2 access_key_id "$R2_ACCESS_KEY_ID"
          dvc remote modify --local r2 secret_access_key "$R2_SECRET_ACCESS_KEY"

      - name: Pull dataset with DVC
        run: |
          dvc pull

      - name: Validate dataset
        run: |
          python scripts/validate_dataset.py \
            --input data/annotated/customer_support_intents.json

      - name: Start MLflow server
        run: |
          python -m mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --artifacts-destination ./mlartifacts \
            --host 127.0.0.1 \
            --port 5000 \
            > mlflow-server.log 2>&1 &

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:5000/health
            then
              echo "MLflow is ready."
              exit 0
            fi

            echo "Waiting for MLflow..."
            sleep 2
          done

          cat mlflow-server.log
          exit 1

      - name: Train and finalize candidate model
        run: |
          python training/finalize_model.py

      - name: Show final metrics
        run: |
          cat artifacts/final_model/metrics.json

      - name: Run model quality gate
        run: |
          python scripts/quality_gate.py

      - name: Verify model artifacts
        run: |
          test -f artifacts/final_model/model.joblib
          test -f artifacts/final_model/metrics.json
          test -f artifacts/final_model/model_metadata.json
          test -f artifacts/final_model/classification_report.json

          ls -lah artifacts/final_model

      - name: Upload candidate model
        uses: actions/upload-artifact@v4
        with:
          name: final-model
          path: artifacts/final_model/
          if-no-files-found: error
          retention-days: 7


  build-and-test:
    name: Build and smoke test application
    runs-on: ubuntu-latest

    needs:
      - train

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: final-model
          path: artifacts/final_model

      - name: Build application stack
        run: |
          docker compose build \
            inference \
            frontend

      - name: Start application stack
        run: |
          docker compose up \
            -d \
            inference \
            frontend

      - name: Wait for inference API
        run: |
          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health
            then
              echo
              echo "Inference API is ready."
              exit 0
            fi

            echo "Waiting for inference API..."
            sleep 2
          done

          docker compose logs inference
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8081/ \
              > /dev/null
            then
              echo "Frontend is ready."
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          docker compose logs frontend
          exit 1

      - name: Smoke test prediction through frontend proxy
        run: |
          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            http://127.0.0.1:8081/api/predict \
            -H "Content-Type: application/json" \
            --data '{"text":"I cannot access my account."}')

          echo "Prediction response:"
          echo "$RESPONSE"

          echo "$RESPONSE" \
            | grep "ACCESS_ACCOUNT"

      - name: Show container status
        if: always()
        run: |
          docker compose ps

      - name: Show application logs on failure
        if: failure()
        run: |
          docker compose logs \
            inference \
            frontend

      - name: Stop application stack
        if: always()
        run: |
          docker compose down


  publish:
    name: Publish deployment images
    runs-on: ubuntu-latest

    needs:
      - train
      - build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: final-model
          path: artifacts/final_model

      - name: Prepare GHCR image names
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" \
            >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/creator-support-inference:latest
            ghcr.io/${{ env.OWNER_LC }}/creator-support-inference:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/creator-support-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/creator-support-frontend:${{ github.sha }}


  deploy:
    name: Deploy to Hetzner production
    runs-on: ubuntu-latest

    needs:
      - publish

    if: github.ref == 'refs/heads/main'

    concurrency:
      group: creator-support-production
      cancel-in-progress: false

    steps:
      - name: Validate deployment secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          test -n "$PROD_HOST" || {
            echo "PROD_HOST is missing"
            exit 1
          }

          test -n "$PROD_USER" || {
            echo "PROD_USER is missing"
            exit 1
          }

          test -n "$PROD_SSH_KEY" || {
            echo "PROD_SSH_KEY is missing"
            exit 1
          }

          echo "Deployment secrets are configured."

      - name: Configure deployment SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$PROD_SSH_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -H "$PROD_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact image version
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$PROD_USER@$PROD_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/creator-support-mlops

          echo "Updating deployment repository..."
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          echo "Deploying image tag: ${IMAGE_TAG}"

          if grep -q '^IMAGE_TAG=' .env.production; then
            sed -i \
              "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" \
              .env.production
          else
            printf \
              '\nIMAGE_TAG=%s\n' \
              "$IMAGE_TAG" \
              >> .env.production
          fi

          echo "Pulling production images..."
          docker compose \
            --env-file .env.production \
            -f compose.production.yml \
            pull \
            inference \
            frontend

          echo "Updating production stack..."
          docker compose \
            --env-file .env.production \
            -f compose.production.yml \
            up -d

          echo "Waiting for production health check..."

          READY=0

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8081/api/health \
              > /dev/null
            then
              READY=1
              echo "Production application is ready."
              break
            fi

            echo "Waiting for production application..."
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Production health check failed."

            docker compose \
              --env-file .env.production \
              -f compose.production.yml \
              ps

            docker compose \
              --env-file .env.production \
              -f compose.production.yml \
              logs \
              --tail=100 \
              inference \
              frontend

            exit 1
          fi

          echo "Running production prediction smoke test..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            http://127.0.0.1:8081/api/predict \
            -H "Content-Type: application/json" \
            --data '{"text":"I cannot access my account."}')

          echo "$RESPONSE"

          echo "$RESPONSE" \
            | grep "ACCESS_ACCOUNT"

          echo "Production containers:"

          docker compose \
            --env-file .env.production \
            -f compose.production.yml \
            ps

          echo "Production deployment completed successfully."
          REMOTE
