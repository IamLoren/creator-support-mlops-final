services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api

    container_name: customer-support-frontend

    ports:
      - "8081:80"

    depends_on:
      - inference

    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: customer-support-inference

    environment:
      MODEL_PATH: /app/artifacts/final_model/model.joblib
      INFERENCE_LOG_PATH: /app/artifacts/production/inference_log.jsonl
      FEEDBACK_LOG_PATH: /app/artifacts/production/feedback_log.jsonl
      FRONTEND_ORIGIN: http://localhost:8081

    ports:
      - "8000:8000"

    volumes:
      - ./artifacts/production:/app/artifacts/production

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    container_name: customer-support-prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      - inference

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest

    container_name: customer-support-grafana

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped
